name: tvOS Build IPA

on:
  push:
    branches: [ master, main ]
    paths:
      - 'tvos/**'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod setup
    
    - name: Generate Xcode project
      working-directory: tvos
      run: xcodegen generate
    
    - name: Install dependencies
      working-directory: tvos
      run: pod install --repo-update
    
    - name: Build app
      working-directory: tvos
      run: |
        xcodebuild -workspace HomeKTVTV.xcworkspace \
          -scheme HomeKTVTV \
          -configuration Release \
          -sdk appletvos \
          -archivePath $PWD/build/HomeKTVTV.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
    
    - name: Verify compiled icon and plist
      working-directory: tvos
      run: |
        APP="build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app"
        echo "=== .app 目录内容 ==="
        ls -la "$APP"
        echo "=== Assets.car（编译后的图标/资源，必须存在）==="
        ls -la "$APP/Assets.car"
        echo "=== Info.plist 关键键校验 ==="
        /usr/libexec/PlistBuddy -c "Print :CFBundleName" "$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
        /usr/libexec/PlistBuddy -c "Print :TVTopShelfImage" "$APP/Info.plist"
        echo "=== 确认根目录没有散落 png（旧方式残留检查）==="
        (ls "$APP"/*.png 2>/dev/null && echo "WARN: 根目录存在散落png" || echo "OK: 无散落png，图标已进Assets.car")
    
    - name: Package IPA
      working-directory: tvos
      run: |
        cd build
        rm -rf Payload
        mkdir -p Payload
        cp -R HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app Payload/
        rm -f HomeKTV-tvOS.ipa
        zip -r HomeKTV-tvOS.ipa Payload
        ls -la HomeKTV-tvOS.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HomeKTV-tvOS-ipa
        path: tvos/build/HomeKTV-tvOS.ipa
        retention-days: 30
