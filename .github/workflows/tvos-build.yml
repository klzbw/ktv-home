name: tvOS Build IPA

on:
  push:
    branches: [ master, main ]
    paths:
      - 'tvos/**'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod setup
    
    - name: Generate Xcode project
      working-directory: tvos
      run: xcodegen generate
    
    - name: Install dependencies
      working-directory: tvos
      run: pod install --repo-update
    
    - name: Build app
      working-directory: tvos
      run: |
        xcodebuild -workspace HomeKTVTV.xcworkspace \
          -scheme HomeKTVTV \
          -configuration Release \
          -sdk appletvos \
          -archivePath $PWD/build/HomeKTVTV.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Verify Assets.car content
      working-directory: tvos
      run: |
        APP="build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app"
        echo "=== .app内容 ==="
        ls -la "$APP/"
        echo ""
        echo "=== Assets.car信息 ==="
        xcrun --sdk appletvos assetutil --info "$APP/Assets.car" 2>/dev/null | head -100
        echo ""
        echo "=== ProductIcon.png ==="
        ls -la build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app/ProductIcon.png 2>/dev/null || echo "No ProductIcon.png"
        ls -la build/HomeKTVTV.xcarchive/BuildProductsPath/ProductIcon.png 2>/dev/null || echo "No BuildProductsPath/ProductIcon.png"
    
    - name: Package IPA
      working-directory: tvos
      run: |
        mkdir -p build/Payload
        cp -R build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app build/Payload/
        cd build
        zip -r HomeKTV-tvOS.ipa Payload
        ls -la HomeKTV-tvOS.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HomeKTV-tvOS-ipa
        path: tvos/build/HomeKTV-tvOS.ipa
        retention-days: 30
