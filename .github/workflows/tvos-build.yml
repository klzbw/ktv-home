name: tvOS Build IPA

on:
  push:
    branches: [ master, main ]
    paths:
      - 'tvos/**'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod setup
    
    - name: Generate Xcode project
      working-directory: tvos
      run: xcodegen generate
    
    - name: Install dependencies
      working-directory: tvos
      run: pod install --repo-update
    
    - name: Build app
      working-directory: tvos
      run: |
        xcodebuild -workspace HomeKTVTV.xcworkspace \
          -scheme HomeKTVTV \
          -configuration Release \
          -sdk appletvos \
          -archivePath $PWD/build/HomeKTVTV.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon
    
    - name: Copy icon files to app bundle
      working-directory: tvos
      run: |
        APP="build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app"
        cp HomeKTVTV/Assets.xcassets/AppIcon.appiconset/AppIcon-*.png "$APP/"
        echo "=== .app根目录图标文件 ==="
        ls -la "$APP/"*.png
    
    - name: Package IPA
      working-directory: tvos
      run: |
        cd build
        rm -rf Payload
        mkdir -p Payload
        cp -R HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app Payload/
        rm -f HomeKTV-tvOS.ipa
        zip -r HomeKTV-tvOS.ipa Payload
        ls -la HomeKTV-tvOS.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HomeKTV-tvOS-ipa
        path: tvos/build/HomeKTV-tvOS.ipa
        retention-days: 30
