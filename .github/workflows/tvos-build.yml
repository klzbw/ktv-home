name: tvOS Build IPA

on:
  push:
    branches: [ master, main ]
    paths:
      - 'tvos/**'
      - '.github/workflows/tvos-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod setup
    
    - name: Generate Xcode project
      working-directory: tvos
      run: xcodegen generate
    
    - name: Install dependencies
      working-directory: tvos
      run: pod install --repo-update
    
    - name: Build app
      working-directory: tvos
      run: |
        xcodebuild -workspace HomeKTVTV.xcworkspace \
          -scheme HomeKTVTV \
          -configuration Release \
          -sdk appletvos \
          -archivePath $PWD/build/HomeKTVTV.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Create exportOptions.plist
      working-directory: tvos
      run: |
        cat > build/exportOptions.plist << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
        </dict>
        </plist>
        EOF
    
    - name: Export IPA
      working-directory: tvos
      run: |
        xcodebuild -exportArchive \
          -archivePath $PWD/build/HomeKTVTV.xcarchive \
          -exportPath $PWD/build/export \
          -exportOptionsPlist $PWD/build/exportOptions.plist \
          CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO || true
        echo "=== export目录 ==="
        ls -la build/export/ 2>/dev/null || echo "export failed, using manual package"
    
    - name: Package IPA (fallback)
      if: failure()
      working-directory: tvos
      run: |
        mkdir -p build/Payload
        cp -R build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app build/Payload/
        cd build
        zip -r HomeKTV-tvOS.ipa Payload
    
    - name: Find IPA
      working-directory: tvos
      run: |
        if [ -f build/export/HomeKTVTV.ipa ]; then
          cp build/export/HomeKTVTV.ipa build/HomeKTV-tvOS.ipa
        elif [ -f build/HomeKTV-tvOS.ipa ]; then
          echo "Using fallback IPA"
        else
          mkdir -p build/Payload
          cp -R build/HomeKTVTV.xcarchive/Products/Applications/HomeKTVTV.app build/Payload/
          cd build && zip -r HomeKTV-tvOS.ipa Payload
        fi
        ls -la build/HomeKTV-tvOS.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HomeKTV-tvOS-ipa
        path: tvos/build/HomeKTV-tvOS.ipa
        retention-days: 30
