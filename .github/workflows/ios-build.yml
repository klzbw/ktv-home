name: iOS Build IPA

on:
  push:
    branches: [ master, main ]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install XcodeGen
      run: brew install xcodegen
    
    - name: Install CocoaPods
      run: |
        gem install cocoapods
        pod setup
    
    - name: Generate Xcode project
      working-directory: ios
      run: xcodegen generate
    
    - name: Install dependencies
      working-directory: ios
      run: pod install --repo-update
    
    - name: Build app
      working-directory: ios
      run: |
        xcodebuild -workspace HomeKTV.xcworkspace           -scheme HomeKTV           -configuration Release           -sdk iphoneos           -archivePath $PWD/build/HomeKTV.xcarchive           archive           CODE_SIGN_IDENTITY=""           CODE_SIGNING_REQUIRED=NO           CODE_SIGNING_ALLOWED=NO
    
    - name: Package IPA
      working-directory: ios
      run: |
        mkdir -p build/Payload
        cp -R build/HomeKTV.xcarchive/Products/Applications/HomeKTV.app build/Payload/
        cd build
        zip -r HomeKTV-iOS.ipa Payload
        ls -la HomeKTV-iOS.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: HomeKTV-iOS-ipa
        path: ios/build/HomeKTV-iOS.ipa
        retention-days: 30
