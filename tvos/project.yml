name: HomeKTVTV
options:
  bundleIdPrefix: com.homektv
  deploymentTarget:
    tvOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_BITCODE: NO
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.homektv.tvos
    TARGETED_DEVICE_FAMILY: "3"
    TVOS_DEPLOYMENT_TARGET: "15.0"
    ONLY_ACTIVE_ARCH: NO
targets:
  HomeKTVTV:
    type: application
    platform: tvOS
    sources:
      - path: HomeKTVTV
    settings:
      base:
        PRODUCT_NAME: HomeKTVTV
        PRODUCT_BUNDLE_IDENTIFIER: com.homektv.tvos
        INFOPLIST_FILE: HomeKTVTV/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        GENERATE_INFOPLIST_FILE: NO
